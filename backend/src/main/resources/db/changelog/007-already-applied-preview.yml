databaseChangeLog:
  - changeSet:
      id: 007-already-applied-preview
      author: codex
      changes:
        - addColumn:
            tableName: campaign_vacancies
            columns:
              - column:
                  name: already_applied
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: hh_account_id
                  type: uuid
              - column:
                  name: resume_id
                  type: uuid
        - sql:
            sql: |
              update campaign_vacancies v
              set hh_account_id = c.hh_account_id,
                  resume_id = c.resume_id
              from campaigns c
              where v.campaign_id = c.id
        - addNotNullConstraint:
            tableName: campaign_vacancies
            columnName: hh_account_id
            columnDataType: uuid
        - addNotNullConstraint:
            tableName: campaign_vacancies
            columnName: resume_id
            columnDataType: uuid
        - createIndex:
            tableName: campaign_vacancies
            indexName: idx_campaign_vacancies_account_resume_hh
            columns:
              - column:
                  name: hh_account_id
              - column:
                  name: resume_id
              - column:
                  name: hh_vacancy_id
        - createIndex:
            tableName: campaign_vacancies
            indexName: idx_campaign_vacancies_apply_status
            columns:
              - column:
                  name: apply_status
