services:
  hh-clicker-clean:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ../hh-clicker-clean-userdata:/app/data
    environment:
      HH_CLEAN_DATA_DIR: /app/data
      LLM_PROVIDER: ${LLM_PROVIDER:-komapi}
      KOMAPI_API_KEY: ${KOMAPI_API_KEY:-}
      KOMAPI_BASE_URL: ${KOMAPI_BASE_URL:-https://www.komapi.top}
      KOMAPI_MODEL: ${KOMAPI_MODEL:-claude-haiku-4-5}
      KOMAPI_ANTHROPIC_VERSION: ${KOMAPI_ANTHROPIC_VERSION:-2023-06-01}
      KOMAPI_MAX_TOKENS: ${KOMAPI_MAX_TOKENS:-700}
      KOMAPI_TIMEOUT_SECONDS: ${KOMAPI_TIMEOUT_SECONDS:-60}
      COVER_LETTER_MAX_TOKENS: ${COVER_LETTER_MAX_TOKENS:-220}
      COVER_LETTER_RESUME_PROMPT_CHARS: ${COVER_LETTER_RESUME_PROMPT_CHARS:-1600}
      COVER_LETTER_VACANCY_PROMPT_CHARS: ${COVER_LETTER_VACANCY_PROMPT_CHARS:-1600}
      COVER_LETTER_MAX_CONCURRENCY: ${COVER_LETTER_MAX_CONCURRENCY:-3}
      COVER_LETTER_MAX_RETRIES: ${COVER_LETTER_MAX_RETRIES:-3}
      COVER_LETTER_RETRY_BASE_DELAY_SECONDS: ${COVER_LETTER_RETRY_BASE_DELAY_SECONDS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
